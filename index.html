
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Connect Cassio • Web Rádio</title>

<meta name="referrer"
      content="strict-origin-when-cross-origin">


<!-- FONTES -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {

    width: 100%;
    min-height: 100%;

}


/* =====================================================
   BODY
   ===================================================== */

body {

    background:

        radial-gradient(
            circle at 50% 15%,
            rgba(23,241,143,.10),
            transparent 30%
        ),

        radial-gradient(
            circle at 20% 80%,
            rgba(0,140,255,.08),
            transparent 30%
        ),

        #020506;

    color: white;

    font-family:
        'Rajdhani',
        sans-serif;

    display: flex;

    justify-content: center;
    align-items: center;

    min-height: 100vh;

    overflow-x: hidden;

}


body::before {

    content: "";

    position: fixed;

    inset: 0;

    background:

        linear-gradient(
            rgba(255,255,255,.015) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.015) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    pointer-events: none;

}


/* =====================================================
   RADIO
   ===================================================== */

.radio {

    width: min(92vw, 430px);

    padding:
        32px
        25px
        25px;

    border:
        1px solid
        rgba(23,241,143,.22);

    border-radius: 28px;

    background:

        linear-gradient(
            145deg,
            rgba(10,20,20,.96),
            rgba(2,8,10,.98)
        );

    box-shadow:

        0 0 40px
        rgba(0,255,150,.08),

        inset 0 0 30px
        rgba(0,255,150,.025);

    position: relative;

    text-align: center;

    backdrop-filter: blur(15px);

}


/* =====================================================
   LOGO
   ===================================================== */

.logo {

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 25px;

    font-weight: 800;

    letter-spacing: 3px;

    color: #17f18f;

    text-shadow:

        0 0 10px
        rgba(23,241,143,.6),

        0 0 25px
        rgba(23,241,143,.25);

}


.subtitle {

    margin-top: 5px;

    font-size: 13px;

    letter-spacing: 5px;

    color:
        rgba(255,255,255,.55);

}


/* =====================================================
   STATUS
   ===================================================== */

.status {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 20px;

    padding:
        6px
        13px;

    border-radius: 30px;

    border:
        1px solid
        rgba(23,241,143,.25);

    background:
        rgba(23,241,143,.06);

    color:
        rgba(255,255,255,.7);

    font-size: 12px;

    letter-spacing: 2px;

}


.status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #555;

    transition: .3s;

}


.status.live .status-dot {

    background: #17f18f;

    box-shadow:

        0 0 8px #17f18f,

        0 0 15px
        rgba(23,241,143,.7);

}


/* =====================================================
   DISCO
   ===================================================== */

.cover {

    width: 220px;
    height: 220px;

    margin:
        25px auto
        20px;

    border-radius: 50%;

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    background:

        radial-gradient(
            circle,
            #101818 0%,
            #07100f 45%,
            #020505 70%,
            #000 100%
        );

    border:
        1px solid
        rgba(23,241,143,.28);

    box-shadow:

        0 0 20px
        rgba(23,241,143,.12),

        0 0 50px
        rgba(23,241,143,.08),

        inset 0 0 35px
        rgba(23,241,143,.07);

}


.cover::before {

    content: "";

    position: absolute;

    inset: 13px;

    border-radius: 50%;

    border:
        1px solid
        rgba(23,241,143,.15);

    box-shadow:

        inset 0 0 20px
        rgba(23,241,143,.12);

}


.cover::after {

    content: "";

    position: absolute;

    width: 35px;
    height: 35px;

    border-radius: 50%;

    background: #020505;

    border:
        2px solid
        #17f18f;

    box-shadow:

        0 0 12px
        rgba(23,241,143,.6);

}


.disc {

    position: absolute;

    inset: 22px;

    border-radius: 50%;

    border:
        1px solid
        rgba(23,241,143,.08);

    background:

        repeating-radial-gradient(
            circle,
            transparent 0px,
            transparent 5px,
            rgba(255,255,255,.025) 6px,
            transparent 7px
        );

    transition: .4s;

}


.playing .disc {

    animation:
        spin
        7s
        linear
        infinite;

}


@keyframes spin {

    from {

        transform:
            rotate(0deg);

    }

    to {

        transform:
            rotate(360deg);

    }

}


/* =====================================================
   NOME DA RÁDIO
   ===================================================== */

.station-name {

    font-family:
        'Orbitron',
        sans-serif;

    font-size: 15px;

    letter-spacing: 2px;

    color:
        rgba(255,255,255,.82);

    margin-bottom: 18px;

}


/* =====================================================
   CONTROLES
   ===================================================== */

.controls {

    display: flex;

    justify-content: center;

    align-items: center;

    /*
       DISTÂNCIA ENTRE OS BOTÕES
    */

    gap: 32px;

}


/* =====================================================
   BOTÕES
   ===================================================== */

.play,
.control-btn {

    border-radius: 50%;

    border:
        1px solid
        rgba(23,241,143,.55);

    background:

        radial-gradient(
            circle,
            rgba(23,241,143,.16),
            rgba(23,241,143,.03)
        );

    color: #17f18f;

    cursor: pointer;

    display: flex;

    align-items: center;
    justify-content: center;

    transition:

        transform .15s,

        box-shadow .2s,

        background .2s;

}


/* =====================================================
   PLAY
   ===================================================== */

.play {

    width: 72px;
    height: 72px;

    font-size: 28px;

    border-color:
        rgba(23,241,143,.75);

    box-shadow:

        0 0 18px
        rgba(23,241,143,.22),

        inset 0 0 20px
        rgba(23,241,143,.08);

}


/* =====================================================
   ANTERIOR / PRÓXIMA
   ===================================================== */

.control-btn {

    width: 52px;
    height: 52px;

    font-size: 20px;

    box-shadow:

        0 0 12px
        rgba(23,241,143,.10),

        inset 0 0 12px
        rgba(23,241,143,.04);

}


/* =====================================================
   HOVER PLAY
   ===================================================== */

.play:hover {

    transform:
        scale(1.05);

    box-shadow:

        0 0 25px
        rgba(23,241,143,.45),

        inset 0 0 25px
        rgba(23,241,143,.12);

}


/* =====================================================
   HOVER OUTROS
   ===================================================== */

.control-btn:hover {

    transform:
        scale(1.08);

    background:

        radial-gradient(
            circle,
            rgba(23,241,143,.25),
            rgba(23,241,143,.05)
        );

    box-shadow:

        0 0 20px
        rgba(23,241,143,.35),

        inset 0 0 15px
        rgba(23,241,143,.08);

}


/* =====================================================
   CLIQUE
   ===================================================== */

.play:active,
.control-btn:active {

    transform:
        scale(.92);

}


/* =====================================================
   VOLUME
   ===================================================== */

.volume-area {

    margin-top: 24px;

    display: flex;

    align-items: center;

    gap: 12px;

}


.volume-icon {

    color:
        rgba(255,255,255,.5);

    font-size: 18px;

}


input[type="range"] {

    appearance: none;

    width: 100%;

    height: 4px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.12);

    outline: none;

}


input[type="range"]::-webkit-slider-thumb {

    appearance: none;

    width: 15px;
    height: 15px;

    border-radius: 50%;

    background: #17f18f;

    box-shadow:

        0 0 10px
        rgba(23,241,143,.7);

    cursor: pointer;

}


input[type="range"]::-moz-range-thumb {

    width: 15px;
    height: 15px;

    border-radius: 50%;

    background: #17f18f;

    border: none;

    cursor: pointer;

}


.volume-value {

    min-width: 35px;

    text-align: right;

    color:
        rgba(255,255,255,.45);

    font-size: 12px;

}


/* =====================================================
   ERRO
   ===================================================== */

.error {

    margin-top: 12px;

    font-size: 11px;

    color: #ff6868;

    display: none;

}


/* =====================================================
   RODAPÉ
   ===================================================== */

.footer {

    margin-top: 25px;

    padding-top: 18px;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    font-size: 10px;

    letter-spacing: 2px;

    color:
        rgba(255,255,255,.28);

}


/* =====================================================
   PLAYER YOUTUBE INVISÍVEL
   ===================================================== */

#youtube-player {

    position: absolute;

    width: 1px;
    height: 1px;

    opacity: 0;

    pointer-events: none;

    left: -9999px;

}


/* =====================================================
   CELULAR
   ===================================================== */

@media (max-width: 420px) {

    .radio {

        padding:
            28px
            18px
            22px;

    }

    .controls {

        gap: 24px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     RADIO
     ===================================================== -->

<div class="radio" id="radio">


    <!-- LOGO -->

    <div class="logo">

        CONNECT CASSIO

    </div>


    <!-- SUBTÍTULO -->

    <div class="subtitle">

        WEB RÁDIO

    </div>


    <!-- STATUS -->

    <div class="status" id="status">

        <span class="status-dot"></span>

        <span id="statusText">

            PAUSADO

        </span>

    </div>


    <!-- DISCO -->

    <div class="cover">

        <div class="disc"></div>

    </div>


    <!-- NOME -->

    <div class="station-name">

        CONNECT CASSIO RADIO

    </div>


    <!-- =================================================
         CONTROLES
         ================================================= -->

    <div class="controls">


        <!-- ANTERIOR -->

        <button

            class="control-btn"

            id="prevButton"

            aria-label="Música anterior"

            title="Música anterior"

            type="button">

            ⏮

        </button>


        <!-- PLAY / PAUSE -->

        <button

            class="play"

            id="playButton"

            aria-label="Reproduzir"

            title="Play / Pause"

            type="button">

            ▶

        </button>


        <!-- PRÓXIMA -->

        <button

            class="control-btn"

            id="nextButton"

            aria-label="Próxima música"

            title="Próxima música"

            type="button">

            ⏭

        </button>


    </div>


    <!-- =================================================
         VOLUME
         ================================================= -->

    <div class="volume-area">


        <span class="volume-icon">

            🔊

        </span>


        <input

            id="volume"

            type="range"

            min="0"

            max="100"

            value="80">


        <span

            class="volume-value"

            id="volumeValue">

            80%

        </span>


    </div>


    <!-- ERRO -->

    <div

        class="error"

        id="errorMessage">

        Não foi possível carregar o player
        do YouTube.

    </div>


    <!-- RODAPÉ -->

    <div class="footer">

        PLAYLIST YOUTUBE • CONNECT CASSIO

    </div>


</div>


<!-- =====================================================
     PLAYER YOUTUBE
     ===================================================== -->

<div id="youtube-player"></div>


<script> /* ===================================================== CONFIGURAÇÃO DA PLAYLIST ALTERE SOMENTE ESTE ID ===================================================== */ const PLAYLIST_ID = "PLNWbSmfvxyQFtCXeLH9BPz9nrrjcIFfCH"; /* ===================================================== ORIGIN AUTOMÁTICO ===================================================== */ const PAGE_ORIGIN = window.location.origin; /* ===================================================== ELEMENTOS ===================================================== */ const playButton = document.getElementById( "playButton" ); const nextButton = document.getElementById( "nextButton" ); const prevButton = document.getElementById( "prevButton" ); const volume = document.getElementById( "volume" ); const volumeValue = document.getElementById( "volumeValue" ); const status = document.getElementById( "status" ); const statusText = document.getElementById( "statusText" ); const radio = document.getElementById( "radio" ); const errorMessage = document.getElementById( "errorMessage" ); /* ===================================================== VARIÁVEIS DO PLAYER ===================================================== */ let player = null; let playerReady = false; /* Estado real informado pelo YouTube. */ let playing = false; /* ESTADO DESEJADO PELO USUÁRIO. true = usuário quer que continue tocando false = usuário quer que fique pausado */ let radioDesejaTocar = false; /* Indica que estamos trocando de música. */ let trocandoMusica = false; /* ===================================================== CARREGAR API YOUTUBE ===================================================== */ const tag = document.createElement( "script" ); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag); /* ===================================================== YOUTUBE API READY ===================================================== */ function onYouTubeIframeAPIReady() { player = new YT.Player( "youtube-player", { width: "1", height: "1", playerVars: { listType: "playlist", list: PLAYLIST_ID, origin: PAGE_ORIGIN, enablejsapi: 1, playsinline: 1, rel: 0, modestbranding: 1 }, events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange, onError: onPlayerError } } ); } /* ===================================================== PLAYER PRONTO ===================================================== */ function onPlayerReady(event) { playerReady = true; player.setVolume( Number( volume.value ) ); console.log( "[RADIO] Player pronto" ); } /* ===================================================== ATUALIZA INTERFACE ===================================================== */ function mostrarTocando() { playing = true; radio.classList.add( "playing" ); status.classList.add( "live" ); statusText.textContent = "NO AR"; playButton.textContent = "❚❚"; playButton.setAttribute( "aria-label", "Pausar" ); playButton.setAttribute( "title", "Pausar" ); errorMessage.style.display = "none"; } function mostrarPausado() { playing = false; radio.classList.remove( "playing" ); status.classList.remove( "live" ); statusText.textContent = "PAUSADO"; playButton.textContent = "▶"; playButton.setAttribute( "aria-label", "Reproduzir" ); playButton.setAttribute( "title", "Play / Pause" ); } /* ===================================================== ESTADO DO PLAYER ===================================================== */ function onPlayerStateChange(event) { console.log( "[YOUTUBE STATE]", event.data, "Deseja tocar:", radioDesejaTocar, "Trocando:", trocandoMusica ); /* ================================================= TOCANDO ================================================= */ if ( event.data === YT.PlayerState.PLAYING ) { trocandoMusica = false; mostrarTocando(); return; } /* ================================================= PAUSADO ================================================= */ if ( event.data === YT.PlayerState.PAUSED ) { /* IMPORTANTE: Se estamos trocando de música e o usuário queria continuar tocando, NÃO consideramos isso como uma pausa feita pelo usuário. */ if ( trocandoMusica && radioDesejaTocar ) { console.log( "[RADIO] PAUSED durante troca - mantendo reprodução" ); return; } /* Aqui sim foi uma pausa verdadeira. */ radioDesejaTocar = false; mostrarPausado(); return; } /* ================================================= FINALIZADO ================================================= */ if ( event.data === YT.PlayerState.ENDED ) { /* Se a playlist estiver avançando normalmente, não queremos transformar isso em uma pausa da rádio. */ if ( radioDesejaTocar ) { console.log( "[RADIO] Música terminou - playlist continuará" ); return; } mostrarPausado(); return; } } /* ===================================================== ERROS ===================================================== */ function onPlayerError(event) { console.log( "[YOUTUBE ERROR]", event.data ); errorMessage.style.display = "block"; /* ERRO 153 */ if ( event.data === 153 ) { errorMessage.textContent = "YouTube bloqueou o player: abra esta página pelo HTTPS/GitHub Pages."; } /* ERRO 101 / 150 */ else if ( event.data === 101 || event.data === 150 ) { errorMessage.textContent = "Este vídeo não permite reprodução incorporada."; } /* ERRO 100 */ else if ( event.data === 100 ) { errorMessage.textContent = "Vídeo não encontrado ou privado."; } } /* ===================================================== PLAY / PAUSE ===================================================== */ playButton.addEventListener( "click", function () { if ( !playerReady || !player ) { console.log( "[RADIO] Player ainda carregando..." ); return; } /* ============================================= SE ESTÁ TOCANDO → PAUSAR ============================================= */ if ( playing ) { /* Aqui foi o usuário que pediu pausa. */ radioDesejaTocar = false; player.pauseVideo(); console.log( "[RADIO] PAUSA solicitada pelo usuário" ); } /* ============================================= SE ESTÁ PAUSADO → TOCAR ============================================= */ else { /* Aqui foi o usuário que pediu reprodução. */ radioDesejaTocar = true; player.playVideo(); console.log( "[RADIO] PLAY solicitado pelo usuário" ); } } ); /* ===================================================== PRÓXIMA MÚSICA ===================================================== */ nextButton.addEventListener( "click", function () { if ( !playerReady || !player ) { return; } console.log( "[RADIO] Próxima música" ); /* GUARDA A INTENÇÃO DO USUÁRIO */ const continuarTocando = radioDesejaTocar || playing; /* Mantém essa intenção durante toda a troca. */ radioDesejaTocar = continuarTocando; trocandoMusica = true; /* Muda para próxima faixa. */ player.nextVideo(); /* Se estava tocando, tenta iniciar a nova faixa. */ if ( continuarTocando ) { setTimeout( function () { if ( player && playerReady && radioDesejaTocar ) { console.log( "[RADIO] Forçando PLAY da próxima" ); player.playVideo(); } }, 700 ); } } ); /* ===================================================== MÚSICA ANTERIOR ===================================================== */ prevButton.addEventListener( "click", function () { if ( !playerReady || !player ) { return; } console.log( "[RADIO] Música anterior" ); /* GUARDA A INTENÇÃO DO USUÁRIO */ const continuarTocando = radioDesejaTocar || playing; /* Mantém a intenção durante a troca. */ radioDesejaTocar = continuarTocando; trocandoMusica = true; /* Volta uma faixa. */ player.previousVideo(); /* Se estava tocando, continua tocando. */ if ( continuarTocando ) { setTimeout( function () { if ( player && playerReady && radioDesejaTocar ) { console.log( "[RADIO] Forçando PLAY da anterior" ); player.playVideo(); } }, 700 ); } } ); /* ===================================================== VOLUME ===================================================== */ volume.addEventListener( "input", function () { const value = Number( this.value ); volumeValue.textContent = value + "%"; if ( playerReady && player ) { player.setVolume( value ); } } ); /* ===================================================== TECLADO ESPAÇO = PLAY / PAUSE → = PRÓXIMA ← = ANTERIOR ===================================================== */ document.addEventListener( "keydown", function (event) { /* Não interfere no volume. */ if ( event.target.tagName === "INPUT" ) { return; } /* ============================================= ESPAÇO ============================================= */ if ( event.code === "Space" ) { event.preventDefault(); playButton.click(); } /* ============================================= SETA DIREITA ============================================= */ else if ( event.code === "ArrowRight" ) { event.preventDefault(); nextButton.click(); } /* ============================================= SETA ESQUERDA ============================================= */ else if ( event.code === "ArrowLeft" ) { event.preventDefault(); prevButton.click(); } } ); </script>


</body>

</html>
